<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unisync-frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', (event) => {
        const div = document.createElement('div');
        div.style.cssText = 'color:red; background:#fff; z-index:9999; position:absolute; top:0; left:0; width:100%; border:2px solid red; white-space:pre-wrap; padding: 20px;';
        div.textContent = event.error ? event.error.stack : event.message;
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', (event) => {
        const div = document.createElement('div');
        div.style.cssText = 'color:red; background:#fff; z-index:9999; position:absolute; top:0; left:0; width:100%; border:2px solid red; white-space:pre-wrap; padding: 20px;';
        div.textContent = 'Unhandled Rejection: ' + (event.reason ? event.reason.stack || event.reason : event);
        document.body.appendChild(div);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
